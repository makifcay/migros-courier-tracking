spring:
  application:
    name: couriertracking
  datasource:
    url: jdbc:h2:mem:courierdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

# Uygulama Parametreleri
courier:
  tracking:
    store-radius-in-meters: 100.0
    reentry-cooldown-minutes: 1